# SwiftLint Configuration for Netrek SwiftUI
# Last updated: Phase 5.7

# Paths to exclude from linting
excluded:
  - Pods
  - .build
  - DerivedData
  - build
  - Carthage

# Paths to include (optional - if not specified, all Swift files are included)
included:
  - Shared
  - NetrekMacOS
  - NetrekIPad

# Analyzer rules (require full build, more expensive)
analyzer_rules:
  - unused_declaration
  - unused_import

# Opt-in rules (not enabled by default)
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - first_where
  - force_unwrapping
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - static_operator
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - yoda_condition

# Disabled rules
disabled_rules:
  - todo # Allow TODO/FIXME comments (we use FUTURE: for planned work)
  - trailing_comma # Allow trailing commas in arrays/dicts
  - implicit_optional_initialization # Allow explicit nil initialization for clarity
  - multiple_closures_with_trailing_closure # Game code often has multiple closures
  - identifier_name # Allow short names like 'me', 'id', etc.
  - type_name # Allow single-letter type names if needed
  - cyclomatic_complexity # Game logic can be complex
  - function_body_length # Packet parsing functions are long by necessity
  - type_body_length # Game entities have many properties
  - file_length # Some files are necessarily large (Universe, PacketAnalyzer)
  - large_tuple # Allow tuples with more than 2 elements
  - nesting # Game state machines can be deeply nested
  - redundant_string_enum_value # Allow explicit enum values for clarity

# Rule configurations

# Line length - warning only (existing code has many long lines)
line_length:
  warning: 140
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

# Function parameter count - allow up to 8 parameters (packet functions need many)
function_parameter_count:
  warning: 8
  error: 10

# Force unwrapping - warning only (some force unwraps are safe in game code)
force_unwrapping: warning

# Force cast - warning only
force_cast: warning

# Vertical whitespace - max 2 blank lines
vertical_whitespace:
  max_empty_lines: 2

# Trailing whitespace - don't ignore empty lines
trailing_whitespace:
  ignores_empty_lines: false
  ignores_comments: false

# Statement position - opening brace on same line
statement_position:
  statement_mode: default

# Opening brace spacing
opening_brace:
  ignore_multiline_function_signatures: true

# Colon spacing - space after, not before
colon:
  flexible_right_spacing: false
  apply_to_dictionaries: true

# Comma spacing
comma: warning

# Control statement - no wrapping in parentheses
control_statement: warning

# Empty parameters
empty_parameters: warning

# Empty parentheses with trailing closure
empty_parentheses_with_trailing_closure: warning

# Legacy constant
legacy_constant: warning

# Legacy constructor
legacy_constructor: warning

# Protocol property accessors order
protocol_property_accessors_order: warning

# Redundant discardable let
redundant_discardable_let: warning

# Redundant void return
redundant_void_return: warning

# Return arrow whitespace
return_arrow_whitespace: warning

# Shorthand operator
shorthand_operator: warning

# Syntactic sugar
syntactic_sugar: warning

# Void return
void_return: warning

# Weak delegate - ensure delegates are weak
weak_delegate: warning

# Mark - require proper // MARK: formatting
mark: warning

# Custom rules
custom_rules:
  # Encourage use of GameLogger over print/debugPrint
  no_direct_print:
    name: "Use GameLogger instead of print()"
    regex: '\bprint\('
    message: "Use GameLogger instead of print() for better log categorization"
    severity: warning

  # Discourage force unwrapping of optionals in new code
  discourage_force_unwrap:
    name: "Avoid force unwrapping"
    regex: '!\s*(//|$)'
    message: "Consider using guard let or if let instead of force unwrapping"
    severity: warning

  # Ensure FUTURE: prefix for planned work items
  future_comments:
    name: "Use FUTURE: prefix for planned work"
    regex: '//\s*TODO(?!:)'
    message: "Use // FUTURE: for planned work items instead of TODO"
    severity: warning

# Reporter type
reporter: "xcode" # Use Xcode reporter for IDE integration
